在一個被極端氣候引響導致的森林大火中，你身為一位森林學系學者來被燒毀的森林調查，途中遇到一位白髮的精靈，他代表了森林的生命，因為森林被燒成一片灰燼，所以他身上的衣服破爛不堪，滿身都是污漬，希望你將他帶回家給與他重塑森林的力量，在這之中你們逐漸培養出深厚的感情。</p>
